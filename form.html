
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Survey</title>
    <link rel="stylesheet" href="public/css/style.css">
</head>
<body>

    <main class="login-container survey-container">
        <h1>The Daily Survey</h1>
        <p>Tell us a little about yourself!</p>

        <nav>
            <a href="/records.html">View Records</a>
        </nav>

        <form id="surveyForm">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="name">Your Name</label>
                <input type="text" id="name" name="name">

                <label for="age">Your Age</label>
                <input type="number" id="age" name="age" min="1" max="120">
            </fieldset>

            <fieldset>
                <legend>Your Preferences</legend>

                <label for="color">Favorite Color</label>
                <select id="color" name="color">
                    <option value="">Select a color</option>
                    <option value="Red">Red</option>
                    <option value="Blue">Blue</option>
                    <option value="Green">Green</option>
                    <option value="Purple">Purple</option>
                    <option value="Yellow">Yellow</option>
                    <option value="Orange">Orange</option>
                </select>

                <p>Preferred Gaming Platform</p>

                <div class="choice">
                    <input type="radio" id="pc" name="platform" value="PC">
                    <label for="pc">PC</label>
                </div>

                <div class="choice">
                    <input type="radio" id="console" name="platform" value="Console">
                    <label for="console">Console</label>
                </div>

                <div class="choice">
                    <input type="radio" id="mobile" name="platform" value="Mobile">
                    <label for="mobile">Mobile</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Gaming Habits</legend>

                <label for="hours">
                    Hours spent gaming per day:
                    <span id="hoursValue">2</span>
                </label>

                <input
                    type="range"
                    id="hours"
                    name="hours"
                    min="0"
                    max="12"
                    value="2"
                >

                <label for="about">Tell us about yourself</label>
                <textarea
                    id="about"
                    name="about"
                    rows="5"
                    placeholder="Write something about yourself..."
                ></textarea>
            </fieldset>

            <button type="submit">Submit Survey</button>

        </form>

        <p id="formMessage"></p>

    </main>

    <script src="public/js/form.js"></script>

</body>
</html>
